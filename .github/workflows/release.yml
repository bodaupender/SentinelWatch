name: SentinelWatch Windows Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Test and package Windows release
    runs-on: windows-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend and test dependencies
        run: python -m pip install -e "backend[dev,sqlite]"

      - name: Run backend tests
        run: python -m pytest backend/tests -q

      - name: Install dashboard dependencies
        run: npm ci --prefix frontend

      - name: Build dashboard
        run: npm run build --prefix frontend

      - name: Package clean Windows source bundle
        id: package
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $asset = Join-Path $env:RUNNER_TEMP "SentinelWatch-$tag-windows.zip"
          git archive --format=zip --prefix=SentinelWatch/ $env:GITHUB_SHA --output=$asset
          "asset=$asset" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub release asset
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: ${{ steps.package.outputs.asset }}
