[project]
name = "sentinelwatch-backend"
version = "0.1.0"
description = "SentinelWatch Backend API"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "SentinelWatch Team", email = "team@sentinelwatch.local"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic[email]>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "ruamel.yaml>=0.18.0",
    "alembic>=1.13.0",
    "python-dotenv>=1.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[argon2]>=1.7.4",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "structlog>=24.1.0",
    "prometheus-client>=0.19.0",
    "tenacity>=8.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
    "bandit>=1.7.0",
    "pre-commit>=3.6.0",
]
postgres = [
    "asyncpg>=0.29.0",
]
sqlite = [
    "aiosqlite>=0.19.0",
]

[project.urls]
Homepage = "https://github.com/sentinelwatch/sentinelwatch"
Repository = "https://github.com/sentinelwatch/sentinelwatch"
Issues = "https://github.com/sentinelwatch/sentinelwatch/issues"

[project.scripts]
sentinelwatch-backend = "sentinelwatch_backend.cli:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["sentinelwatch_backend*"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --strict-config"
asyncio_mode = "auto"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
    "api: API tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
show_error_codes = true
pretty = true
namespace_packages = true
explicit_package_bases = true
enable_error_code = ["ignore-without-code"]

[tool.ruff]
target-version = "py312"
line-length = 100
indent-style = "space"
indent-width = 4
quote-style = "double"
docstring-code-format = true
lint.select = [
    "E", "W", "F", "I", "N", "UP", "B", "C4", "T20", "PTH", "TRY", "SIM", "RUF", "ARG", "PL",
]
lint.ignore = ["S101", "TRY003"]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "TRY003"]
format.preview = true

[tool.ruff.isort]
known-first-party = ["sentinelwatch_backend"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]
targets = ["src"]

[tool.coverage.run]
source = ["src/sentinelwatch_backend"]
omit = ["*/tests/*", "*/conftest.py", "*/migrations/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
